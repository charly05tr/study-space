upstream mecani_api {
    server web:8000;
}

server {
    listen 80;
    server_name api.mecani.app;

    # AUMENTAR TAMAÑO DE CARGA
    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 1. Archivos Estáticos
    location /static/ {
        alias /app/staticfiles/;
    }

    # 2. Archivos Media
    location /media/ {
        alias /app/media/;
    }

    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        
        # Estas dos cabeceras son la magia que mantiene el túnel abierto
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Opcional: Aumentar el timeout si tus websockets se desconectan por inactividad
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 3. Proxy hacia Django (Gunicorn)
    location / {
        proxy_pass http://mecani_api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        
        # IMPORTANTE: Tomamos el protocolo que nos manda NPM
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        
        proxy_redirect off;
    }
}