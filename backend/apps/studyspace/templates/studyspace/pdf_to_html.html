<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to HTML</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        form {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }

        h1 { font-size: 1.4rem; margin: 0 0 0.5rem 0; }
        p { color: #64748b; margin: 0 0 1.5rem 0; font-size: 0.9rem; }
        input[type="file"] { width: 100%; margin-bottom: 1.5rem; }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background-color: #1e40af; }
    </style>
</head>
<body>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <h1>PDF to HTML</h1>
        <p>Pick a PDF file to convert it into a paginated HTML document.</p>
        <input type="file" name="pdf" accept="application/pdf" required>
        <button type="submit">Convert</button>
    </form>
</body>
</html>
